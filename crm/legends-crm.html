<title>Legends CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@400;500;600;700&display=swap">
<style>
/* Layout: fixed brand sidebar + working canvas on desktop; bottom tab bar on phones. Forms open in a side sheet. */
:root {
  --bg: #eef3f1;
  --surface: #ffffff;
  --surface-2: #e4ece9;
  --line: #cfdcd7;
  --fg: #0b1419;
  --muted: #55666c;
  --accent: #237a60;
  --accent-soft: #d5ece4;
  --accent-ink: #ffffff;
  --gold: #9a6a00;
  --gold-soft: #f8ecc9;
  --ok: #217a4b;
  --ok-soft: #dcf1e5;
  --warn: #93600a;
  --warn-soft: #fbedd0;
  --bad: #b3261e;
  --bad-soft: #f8dedb;
  --info: #255f99;
  --info-soft: #dce9f6;
  --nav-bg: #0b1419;
  --nav-fg: #c9d8dd;
  --nav-active: #8fd3bd;
  --shadow: 0 10px 30px rgba(11, 20, 25, .14);
  --scrim: rgba(7, 13, 17, .45);

  --display: "Anton", "Impact", "Arial Narrow Bold", sans-serif;
  --body: "Montserrat", system-ui, -apple-system, "Segoe UI", sans-serif;

  --radius: 12px;
  --gutter: 16px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #070d11; --surface: #0e1a21; --surface-2: #14242d; --line: #24404d;
    --fg: #f2f7f8; --muted: #9fb4bc; --accent: #8fd3bd; --accent-soft: #163a31; --accent-ink: #062018;
    --gold: #f4c95d; --gold-soft: #3a2e0c;
    --ok: #7fd6a4; --ok-soft: #12321f; --warn: #f2c063; --warn-soft: #3a2a0b;
    --bad: #f5978f; --bad-soft: #3d1613; --info: #92c2f2; --info-soft: #132a40;
    --nav-bg: #050a0d; --nav-fg: #a9bec6; --nav-active: #8fd3bd;
    --shadow: 0 10px 30px rgba(0, 0, 0, .5); --scrim: rgba(0, 0, 0, .6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #070d11; --surface: #0e1a21; --surface-2: #14242d; --line: #24404d;
  --fg: #f2f7f8; --muted: #9fb4bc; --accent: #8fd3bd; --accent-soft: #163a31; --accent-ink: #062018;
  --gold: #f4c95d; --gold-soft: #3a2e0c;
  --ok: #7fd6a4; --ok-soft: #12321f; --warn: #f2c063; --warn-soft: #3a2a0b;
  --bad: #f5978f; --bad-soft: #3d1613; --info: #92c2f2; --info-soft: #132a40;
  --nav-bg: #050a0d; --nav-fg: #a9bec6; --nav-active: #8fd3bd;
  --shadow: 0 10px 30px rgba(0, 0, 0, .5); --scrim: rgba(0, 0, 0, .6);
  color-scheme: dark;
}

* , *::before, *::after { box-sizing: border-box; }
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.num { font-variant-numeric: tabular-nums; }

/* Shell */
.shell { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100vh; }
.side { background: var(--nav-bg); color: var(--nav-fg); position: sticky; top: 0; height: 100vh; overflow-y: auto; padding: 22px 14px; display: flex; flex-direction: column; gap: 20px; }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 8px; }
.brand-mark { width: 38px; height: 38px; border-radius: 50%; background: var(--nav-active); color: #062018; display: grid; place-items: center; font-family: var(--display); font-size: 20px; letter-spacing: .02em; }
.brand-name { font-family: var(--display); font-size: 24px; letter-spacing: .04em; color: #fff; line-height: 1; text-transform: uppercase; }
.brand-name small { display: block; font-family: var(--body); font-size: 10.5px; letter-spacing: .14em; color: var(--nav-fg); font-weight: 600; margin-top: 4px; }
.nav-group { display: flex; flex-direction: column; gap: 2px; }
.nav-label { font-size: 10.5px; text-transform: uppercase; letter-spacing: .14em; font-weight: 700; opacity: .6; padding: 6px 10px; }
.nav-btn { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: none; border: 0; color: var(--nav-fg); padding: 9px 10px; border-radius: 9px; cursor: pointer; font-weight: 600; font-size: 13.5px; }
.nav-btn svg { width: 18px; height: 18px; flex: none; }
.nav-btn:hover { background: rgba(255,255,255,.06); color: #fff; }
.nav-btn[aria-current="page"] { background: rgba(143,211,189,.14); color: var(--nav-active); }
.nav-btn .count { margin-left: auto; font-size: 11px; background: rgba(255,255,255,.1); padding: 1px 7px; border-radius: 99px; }
.sync { margin-top: auto; font-size: 12px; padding: 10px; border-radius: 10px; background: rgba(255,255,255,.05); display: flex; gap: 8px; align-items: flex-start; }
.sync-dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 5px; flex: none; background: #f4c95d; }
.sync[data-mode="cloud"] .sync-dot { background: #7fd6a4; }

.main { min-width: 0; padding-block: 24px 60px; padding-inline: 28px; }
.topbar { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 20px; margin-bottom: 20px; }
.eyebrow { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; font-weight: 700; color: var(--muted); margin: 0 0 2px; }
h1 { font-family: var(--display); font-weight: 400; font-size: clamp(28px, 4vw, 38px); letter-spacing: .02em; text-transform: uppercase; line-height: 1.05; margin: 0; text-wrap: balance; }
h2 { font-size: 15px; font-weight: 700; margin: 0; }
h3 { font-size: 13px; font-weight: 700; margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

/* Tab bar (phones) */
.tabbar { display: none; }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 9px; padding: 8px 13px; font-weight: 600; font-size: 13px; cursor: pointer; white-space: nowrap; text-decoration: none; line-height: 1.2; }
.btn:hover { border-color: var(--accent); }
.btn svg { width: 16px; height: 16px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--fg); background: var(--surface-2); }
.btn.danger { color: var(--bad); }
.btn.danger:hover { border-color: var(--bad); }
.btn.sm { padding: 5px 9px; font-size: 12px; border-radius: 7px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.icon-btn { border: 0; background: none; cursor: pointer; color: var(--muted); padding: 4px; border-radius: 6px; display: inline-grid; place-items: center; }
.icon-btn:hover { color: var(--fg); background: var(--surface-2); }
.icon-btn svg { width: 16px; height: 16px; }

/* Panels */
.grid { display: grid; gap: 16px; }
.cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.split { grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); min-width: 0; }
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 16px 10px; flex-wrap: wrap; }
.panel-body { padding: 0 16px 16px; }
.panel-body.flush { padding: 0; }

.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; min-width: 0; text-align: left; cursor: pointer; }
.kpi:hover { border-color: var(--accent); }
.kpi-label { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; font-weight: 700; color: var(--muted); }
.kpi-value { font-family: var(--display); font-size: 30px; letter-spacing: .02em; line-height: 1.15; margin-top: 4px; font-variant-numeric: tabular-nums; }
.kpi-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
.kpi-sub.bad { color: var(--bad); font-weight: 600; }

/* Lists */
.rows { list-style: none; margin: 0; padding: 0; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 11px 16px; border-top: 1px solid var(--line); min-width: 0; }
.row:first-child { border-top: 0; }
.row.click { cursor: pointer; }
.row.click:hover { background: var(--surface-2); }
.row-main { flex: 1 1 180px; min-width: 0; }
.row-title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-sub { font-size: 12.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-end { text-align: right; flex: none; }
.time { font-weight: 700; font-variant-numeric: tabular-nums; width: 64px; flex: none; font-size: 13px; }

.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700; padding: 10px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 11px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
tbody tr.click { cursor: pointer; }
tbody tr.click:hover td { background: var(--surface-2); }
td.r, th.r { text-align: right; }
td.strong { font-weight: 600; }

/* Status pills */
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 99px; text-transform: uppercase; letter-spacing: .06em; white-space: nowrap; background: var(--surface-2); color: var(--muted); }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.info { background: var(--info-soft); color: var(--info); }
.pill.accent { background: var(--accent-soft); color: var(--accent); }
.tag { display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 6px; background: var(--surface-2); color: var(--muted); margin-right: 4px; }
.tag.example { background: var(--gold-soft); color: var(--gold); }

/* Toolbar */
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
.search { flex: 1 1 220px; min-width: 0; position: relative; }
.search input { width: 100%; padding-left: 34px; }
.search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--muted); pointer-events: none; }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 9px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: none; padding: 6px 11px; border-radius: 7px; font-weight: 600; font-size: 12.5px; color: var(--muted); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.12); }

/* Forms */
input[type="text"], input[type="tel"], input[type="email"], input[type="number"], input[type="date"], input[type="time"], input[type="search"], select, textarea {
  width: 100%; min-width: 0; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 10px; font-size: 14px;
}
textarea { resize: vertical; min-height: 70px; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: var(--accent); }
.form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 14px; }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field.full { grid-column: 1 / -1; }
.field label, .field .label { font-size: 12px; font-weight: 700; color: var(--muted); }
.field .hint { font-size: 11.5px; color: var(--muted); }
.fieldset-title { grid-column: 1 / -1; font-size: 11px; text-transform: uppercase; letter-spacing: .12em; font-weight: 700; color: var(--accent); margin-top: 6px; padding-top: 12px; border-top: 1px solid var(--line); }
.check { display: flex; align-items: center; gap: 8px; font-weight: 600; }

/* Line items */
.items { display: flex; flex-direction: column; gap: 8px; }
.item-row { display: grid; grid-template-columns: minmax(0, 1fr) 72px 96px 90px 28px; gap: 6px; align-items: center; }
.item-row .line-total { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; font-size: 13px; }
.item-head { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.totals { display: grid; grid-template-columns: auto auto; justify-content: end; gap: 4px 20px; margin-top: 6px; font-variant-numeric: tabular-nums; }
.totals .grand { font-weight: 700; font-size: 16px; }

/* Sheet */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 40; }
.sheet { position: fixed; top: 0; right: 0; bottom: 0; width: min(620px, 100%); background: var(--bg); z-index: 41; display: flex; flex-direction: column; box-shadow: var(--shadow); padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--line); background: var(--surface); }
.sheet-head h2 { font-family: var(--display); font-weight: 400; font-size: 22px; letter-spacing: .03em; text-transform: uppercase; }
.sheet-body { flex: 1; overflow-y: auto; padding: 18px 20px 24px; }
.sheet-foot { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; padding: 12px 20px; border-top: 1px solid var(--line); background: var(--surface); }
.sheet-foot .spacer { flex: 1; }

/* Dialog */
.dialog { position: fixed; z-index: 51; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(420px, calc(100% - 32px)); background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); padding: 20px; display: grid; gap: 14px; }
.dialog-scrim { z-index: 50; }

/* Toast */
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-weight: 600; z-index: 60; box-shadow: var(--shadow); max-width: calc(100% - 32px); }

/* Kanban */
.board { display: grid; grid-template-columns: repeat(5, minmax(220px, 1fr)); gap: 12px; overflow-x: auto; padding-bottom: 8px; }
.col { background: var(--surface-2); border-radius: var(--radius); padding: 10px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.col-head { display: flex; justify-content: space-between; align-items: baseline; padding: 2px 4px 4px; gap: 8px; }
.col-head h3 { text-transform: uppercase; letter-spacing: .08em; font-size: 11.5px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; cursor: pointer; display: grid; gap: 4px; }
.card:hover { border-color: var(--accent); }
.card-foot { display: flex; justify-content: space-between; align-items: center; gap: 6px; margin-top: 4px; }

/* Schedule */
.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
.day { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); min-height: 170px; display: flex; flex-direction: column; min-width: 0; }
.day.today { border-color: var(--accent); box-shadow: inset 0 3px 0 var(--accent); }
.day-head { padding: 8px 10px; display: flex; justify-content: space-between; align-items: baseline; gap: 4px; border-bottom: 1px solid var(--line); }
.day-head b { font-family: var(--display); font-weight: 400; font-size: 20px; }
.day-jobs { padding: 6px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
.job-chip { border-radius: 8px; padding: 6px 8px; background: var(--accent-soft); cursor: pointer; font-size: 12px; min-width: 0; border-left: 3px solid var(--accent); }
.job-chip.done { background: var(--ok-soft); border-left-color: var(--ok); }
.job-chip.cancelled { opacity: .55; text-decoration: line-through; border-left-color: var(--muted); background: var(--surface-2); }
.job-chip.in_progress { background: var(--warn-soft); border-left-color: var(--warn); }
.job-chip .t { font-weight: 700; font-variant-numeric: tabular-nums; }
.job-chip .n { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.day-total { padding: 6px 10px; font-size: 11.5px; color: var(--muted); border-top: 1px solid var(--line); font-variant-numeric: tabular-nums; }

/* Customer detail */
.profile { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); gap: 16px; align-items: start; }
.dl { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px 14px; margin: 0; }
.dl dt { font-size: 12px; color: var(--muted); font-weight: 600; }
.dl dd { margin: 0; overflow-wrap: anywhere; }
.balance { font-family: var(--display); font-size: 28px; letter-spacing: .02em; }
.contact-line { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

/* Empty state */
.empty { text-align: center; padding: 28px 20px; color: var(--muted); }
.empty strong { display: block; color: var(--fg); font-size: 14px; margin-bottom: 4px; }
.empty .actions { justify-content: center; margin-top: 12px; }
.welcome { background: var(--surface); border: 1px dashed var(--accent); border-radius: var(--radius); padding: 22px; margin-bottom: 16px; display: grid; gap: 10px; }
.welcome h2 { font-family: var(--display); font-weight: 400; font-size: 24px; text-transform: uppercase; letter-spacing: .03em; }
.welcome ol { margin: 0; padding-left: 20px; display: grid; gap: 4px; }

/* Chart */
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart .bar { fill: var(--accent); }
.chart .bar.cur { fill: var(--gold); }
.chart .hit { fill: transparent; cursor: default; }
.chart .hit:hover + .bar, .chart g:hover .bar { opacity: .8; }
.chart .grid-line { stroke: var(--line); stroke-width: 1; }
.chart text { fill: var(--muted); font-size: 12px; font-family: var(--body); }
.chart .tip { position: absolute; pointer-events: none; background: var(--fg); color: var(--bg); padding: 6px 9px; border-radius: 7px; font-size: 12px; font-weight: 600; white-space: nowrap; transform: translate(-50%, -110%); }
.hbar { height: 8px; border-radius: 4px; background: var(--accent); min-width: 2px; }
.hbar-track { background: var(--surface-2); border-radius: 4px; width: 100%; }

.doc-preview { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; display: grid; gap: 14px; }
.doc-preview .head { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.copybox { white-space: pre-wrap; background: var(--surface-2); border-radius: 10px; padding: 12px; font-size: 13px; }

@media (max-width: 1100px) {
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .split, .profile { grid-template-columns: minmax(0, 1fr); }
  .week { grid-template-columns: minmax(0, 1fr); }
  .day { min-height: 0; }
}
@media (max-width: 820px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .side { display: none; }
  .main { padding-inline: var(--gutter); padding-block: 16px 96px; }
  .cols-2, .cols-3 { grid-template-columns: minmax(0, 1fr); }
  .tabbar { display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--nav-bg); padding: 6px 4px calc(6px + env(safe-area-inset-bottom, 0px)); justify-content: space-around; }
  .tabbar button { background: none; border: 0; color: var(--nav-fg); display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 10.5px; font-weight: 600; padding: 4px 6px; cursor: pointer; flex: 1; }
  .tabbar button svg { width: 20px; height: 20px; }
  .tabbar button[aria-current="page"] { color: var(--nav-active); }
  .form { grid-template-columns: minmax(0, 1fr); }
  .item-row { grid-template-columns: minmax(0, 1fr) 56px 80px 28px; }
  .item-row .line-total { display: none; }
  .hide-sm { display: none; }
  .board { grid-template-columns: repeat(5, minmax(240px, 82%)); }
}
@media (max-width: 480px) {
  .kpi-value { font-size: 24px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<div class="shell">
  <aside class="side" aria-label="Main navigation">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">L</div>
      <div class="brand-name">Legends<small>CRM</small></div>
    </div>
    <nav id="side-nav" class="nav-group"></nav>
    <div class="sync" id="sync" data-mode="connecting"><span class="sync-dot"></span><span id="sync-text">Connecting…</span></div>
  </aside>
  <main class="main" id="view" tabindex="-1"></main>
</div>
<nav class="tabbar" id="tabbar" aria-label="Main navigation"></nav>
<div id="layer"></div>
<div id="toast" class="toast" role="status" hidden></div>

<script>
(function () {
"use strict";

/* ---------- Icons ---------- */

function lsGet(k) { try { return JSON.parse(localStorage.getItem(k) || "null"); } catch (e) { return null; } }

function canWrite() {
  if (mode === "connecting") { toast("Still connecting. Try again in a moment."); return false; }
  if (!writeOk) { toast("You have view-only access to this CRM."); return false; }
  return true;
}
function save(col, obj) {
  if (!canWrite()) return null;
  const rec = JSON.parse(JSON.stringify(obj));
  rec.id = rec.id || uid();
  rec.createdAt = rec.createdAt || new Date().toISOString();
  rec.updatedAt = new Date().toISOString();
  S[col][rec.id] = rec; persist(); scheduleRender();
  if (db) queueWrite(col, rec.id, () => db.collection(col).doc(rec.id).set(rec));
  return rec;
}
function remove(col, id) {
  if (!canWrite()) return;
  delete S[col][id]; persist(); scheduleRender();
  if (db) queueWrite(col, id, () => db.collection(col).doc(id).delete());
}
function queueWrite(col, id, fn) {
  const key = col + "/" + id;
  const run = () => fn().catch((e) => {
    const code = e && e.code;
    if (code === "unavailable") return new Promise((r) => setTimeout(r, 600 + Math.random() * 900)).then(fn).catch(writeFailed);
    writeFailed(e);
  });
  writeChains[key] = (writeChains[key] || Promise.resolve()).then(run);
}
function writeFailed(e) {
  const code = e && e.code;
  if (code === "invalid_argument" || code === "not_granted") { writeOk = false; toast("Couldn't save: you have view-only access."); }
  else if (code === "quota_exceeded") toast("Storage is full. Delete old records to save new ones.");
  else toast("Couldn't save that change. Check your connection and try again.");
}
function nextNumber(col, prefix) {
  let max = 1000;
  all(col).forEach((r) => { const n = parseInt(String(r.number || "").replace(/\D/g, ""), 10); if (n > max) max = n; });
  return prefix + (max + 1);
}

function calc(items, taxRate, discount) {
  const subtotal = round2((items || []).reduce((s, i) => s + num(i.qty) * num(i.price), 0));
  const disc = round2(num(discount));
  const tax = round2(Math.max(0, subtotal - disc) * num(taxRate) / 100);
  return { subtotal, discount: disc, tax, total: round2(Math.max(0, subtotal - disc) + tax) };
}
function invStatus(inv) {

}

  let h = top("Week of " + fmtDate(ws, { month: "long", day: "numeric" }), "Schedule",

function rankPanel(title, obj, labelFn) {

    '<div><div style="display:flex;justify-content:space-between;gap:10px" class="small"><span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + labelFn(k) + '</span><b class="num">' + money0(v) + '</b></div><div class="hbar-track"><div class="hbar" style="width:' + (max ? Math.max(1, v / max * 100) : 0) + '%"></div></div></div>').join("") + "</div>" : empty("Nothing yet", "")) + "</div></section>";

function monthChart(n) {
  const cur = today().slice(0, 8) + "01";
  const data = Array.from({ length: n }, (_, i) => { const ms = addMonths(cur, i - n + 1), me = addDays(addMonths(ms, 1), -1); return { label: parse(ms).toLocaleDateString("en-US", { month: "short" }), full: parse(ms).toLocaleDateString("en-US", { month: "long", year: "numeric" }), v: paidIn(ms, me).reduce((a, x) => a + num(x.total), 0) }; });
  const W = 440, H = 190, padL = 42, padB = 22, padT = 10, max = Math.max(...data.map((d) => d.v));
  if (!max) return '<div class="empty" style="padding:16px 0">' + "<strong>No payments recorded yet</strong>Mark invoices paid and this chart fills in.</div>";
  const step = niceStep(max / 3), top = step * Math.ceil(max / step), y = (v) => padT + (H - padT - padB) * (1 - v / top);
  const bw = (W - padL) / n, barW = Math.min(36, bw * 0.6);
  let s = '<div class="chart" role="img" aria-label="Paid revenue by month"><svg viewBox="0 0 ' + W + " " + H + '">';
  for (let v = 0; v <= top + 1e-9; v += step) s += '<line class="grid-line" x1="' + padL + '" x2="' + W + '" y1="' + y(v) + '" y2="' + y(v) + '"/><text x="' + (padL - 8) + '" y="' + (y(v) + 4) + '" text-anchor="end">' + esc(shortMoney(v)) + "</text>";
  data.forEach((d, i) => {
    const x = padL + i * bw + (bw - barW) / 2, yy = y(d.v), h = H - padB - yy, r = Math.min(4, h);
    const path = h > 0 ? "M" + x + "," + (H - padB) + "V" + (yy + r) + "Q" + x + "," + yy + " " + (x + r) + "," + yy + "H" + (x + barW - r) + "Q" + (x + barW) + "," + yy + " " + (x + barW) + "," + (yy + r) + "V" + (H - padB) + "Z" : "";
    s += '<g data-tip="' + esc(d.full + ": " + money(d.v)) + '"><rect class="hit" x="' + (padL + i * bw) + '" y="' + padT + '" width="' + bw + '" height="' + (H - padT) + '"/>' + (path ? '<path class="bar' + (i === n - 1 ? " cur" : "") + '" d="' + path + '"/>' : "") + '<text x="' + (x + barW / 2) + '" y="' + (H - 6) + '" text-anchor="middle">' + esc(d.label) + "</text></g>";
  });
  return s + '</svg><div class="tip" hidden></div></div>';
}
function niceStep(raw) { const p = Math.pow(10, Math.floor(Math.log10(raw || 1))); const f = raw / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p; }
function shortMoney(v) { return v >= 1000 ? "$" + (v / 1000).toFixed(v % 1000 ? 1 : 0) + "k" : "$" + Math.round(v); }
function bindChart(el) {
  const tip = $(".tip", el); if (!tip) return;
  $$("g[data-tip]", el).forEach((g) => {
    g.addEventListener("mouseenter", () => { const b = el.getBoundingClientRect(), r = g.getBoundingClientRect(); tip.textContent = g.dataset.tip; tip.hidden = false; tip.style.left = (r.left - b.left + r.width / 2) + "px"; tip.style.top = Math.max(24, (($("path", g) || g).getBoundingClientRect().top - b.top)) + "px"; });
    g.addEventListener("mouseleave", () => { tip.hidden = true; });
  });
}

  "lead-move": (d) => { const l = get("leads", d.id); const i = STAGES.findIndex((s) => s.id === (l.stage || "new")); const n = STAGES[Math.max(0, Math.min(STAGES.length - 1, i + num(d.n)))]; save("leads", Object.assign({}, l, { stage: n.id })); },
  "lead-convert": (d) => { const l = get("leads", d.id); if (!l) return; const c = save("customers", { name: l.name, phone: l.phone, email: l.email, address: l.address, city: l.city, source: l.source, notes: [l.service, l.notes].filter(Boolean).join("\n"), type: "Residential", tags: [], example: l.example }); if (!c) return; save("leads", Object.assign({}, l, { stage: "won", customerId: c.id })); closeSheet(); toast("Customer created from lead"); go("customer", c.id); },
  "new-quote": (d) => docSheet("quotes", { customerId: d.customer }),
  "edit-quote": (d) => docSheet("quotes", get("quotes", d.id)),
  "view-quote": (d) => viewQuote(d.id),
  "quote-status": (d) => { const q = get("quotes", d.id); save("quotes", Object.assign({}, q, { status: d.s })); viewQuote(d.id); toast("Quote marked " + QUOTE_STATUS[d.s][0].toLowerCase()); },
  "quote-job": (d) => { const q = get("quotes", d.id); docSheet("jobs", { customerId: q.customerId, items: q.items, taxRate: q.taxRate, discount: q.discount, notes: q.notes, fromQuote: q.id, quoteId: q.id, date: addDays(today(), 1) }); },
  "new-job": (d) => docSheet("jobs", { customerId: d.customer, date: d.date || today() }),
  "edit-job": (d) => { const j = get("jobs", d.id); docSheet("jobs", j); const foot = $(".sheet-foot .spacer"); if (foot && j) foot.insertAdjacentHTML("afterend", (j.invoiceId ? btn("view-invoice", "View invoice", { data: { id: j.invoiceId } }) : btn("job-invoice", "Create invoice", { data: { id: j.id } })) + '<button type="button" class="btn" data-act="text" data-tpl="omw" data-job="' + j.id + '">' + ico("msg") + "On my way</button>"); },
  "job-status": (d) => { const j = get("jobs", d.id); save("jobs", Object.assign({}, j, { status: d.s })); },
  "job-done": (d) => { const j = get("jobs", d.id); const saved = save("jobs", Object.assign({}, j, { status: "done", completedAt: today() })); if (saved && !j.invoiceId) ACT["job-invoice"]({ id: d.id }); },
  "job-invoice": (d) => { const j = get("jobs", d.id); const s = settings(); docSheet("invoices", { customerId: j.customerId, items: j.items, taxRate: j.taxRate, discount: j.discount, issued: today(), due: addDays(today(), num(s.terms) || 7), fromJob: j.id, jobId: j.id }); },
  "new-invoice": (d) => docSheet("invoices", { customerId: d.customer }),
  "edit-invoice": (d) => docSheet("invoices", get("invoices", d.id)),
  "view-invoice": (d) => viewInvoice(d.id),
  "inv-paid": (d) => { const i = get("invoices", d.id); if (save("invoices", Object.assign({}, i, { status: "paid", paidAt: today(), method: d.m }))) { viewInvoice(d.id); toast(money(i.total) + " recorded as paid"); } },
  "del-doc": (d) => confirmBox("Delete this " + (d.kind === "quotes" ? "quote" : d.kind === "jobs" ? "job" : "invoice") + "?", "Delete", () => { remove(d.kind, d.id); closeSheet(); toast("Deleted"); }),
  "new-plan": (d) => planSheet({ customerId: d.customer }),
  "edit-plan": (d) => planSheet(get("plans", d.id)),
  "del-plan": (d) => confirmBox("Delete this recurring plan?", "Delete", () => { remove("plans", d.id); closeSheet(); toast("Plan deleted"); }),
  "plan-schedule": (d) => { const p = get("plans", d.id); const its = [{ name: p.service || "Window cleaning", qty: 1, price: p.price }]; docSheet("jobs", { customerId: p.customerId, date: p.nextDate < today() ? today() : p.nextDate, items: its, planId: p.id, notes: p.notes }); sheetAfter = () => { save("plans", Object.assign({}, get("plans", p.id), { nextDate: advance(p.nextDate, p.frequency), lastScheduled: today() })); }; },
  "new-expense": () => expenseSheet(),
  "edit-expense": (d) => expenseSheet(get("expenses", d.id)),
  "del-expense": (d) => confirmBox("Delete this expense?", "Delete", () => { remove("expenses", d.id); closeSheet(); toast("Expense deleted"); }),
  "new-service": () => serviceSheet(),
  "edit-service": (d) => serviceSheet(get("services", d.id)),
  "del-service": (d) => confirmBox("Delete this service from your price book?", "Delete", () => { remove("services", d.id); closeSheet(); toast("Service deleted"); }),
  "starter-services": () => { STARTER_SERVICES.forEach(([n, u], i) => save("services", { name: n, unit: u, price: 0, order: i })); toast("Added " + STARTER_SERVICES.length + " services. Tap each one to set your price."); },
  "new-task": (d) => taskSheet(d.customer),
  "toggle-task": (d) => { const x = get("tasks", d.id); save("tasks", Object.assign({}, x, { done: true, doneAt: today() })); toast("Task done"); },
  "del-task": (d) => remove("tasks", d.id),
  text: (d) => textSheet(d),
  "add-item": () => { $("#items").insertAdjacentHTML("beforeend", itemRow({ name: "", qty: 1, price: "" })); const rows = $$("#items .it-name"); rows[rows.length - 1].focus(); updateTotals($("#sheet-form")); },
  "del-item": (d, el) => { el.closest(".item-row").remove(); updateTotals($("#sheet-form")); },
  "load-examples": () => loadExamples(),
  "clear-examples": () => confirmBox("Remove all records marked Example?", "Remove", clearExamples),
  export: () => exportData(),
  wipe: () => confirmBox("Erase every customer, job, quote and invoice? Export a backup first. This can't be undone.", "Erase everything", () => { if (!canWrite()) return; COLS.forEach((c) => all(c).forEach((r) => remove(c, r.id))); toast("All records erased"); go("home"); })
};
let sheetAfter = null;

async function exportData() {
  const payload = JSON.stringify({ app: "Legends CRM", exportedAt: new Date().toISOString(), data: S }, null, 2);
  const filename = "legends-crm-backup-" + today() + ".json";
  if (window.claude && window.claude.use) {
    const dl = await window.claude.use("downloads").catch(() => null);
    if (dl) { try { await dl.save({ filename, data: payload }); return; } catch (e) { if (e && e.code === "cancelled") return; } }
  }
  try { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([payload], { type: "application/json" })); a.download = filename; document.body.appendChild(a); a.click(); a.remove(); }
  catch (e) { copyText(payload); }
}
function importData(file) {
  const r = new FileReader();
  r.onload = () => {
    let parsed; try { parsed = JSON.parse(r.result); } catch (e) { return toast("That file isn't a Legends CRM backup."); }
    const data = parsed && parsed.data; if (!data || typeof data !== "object") return toast("That file isn't a Legends CRM backup.");
    const n = COLS.reduce((a, c) => a + Object.keys(data[c] || {}).length, 0);
    confirmBox("Import " + n + " records? Records with the same ID are replaced; everything else stays.", "Import", () => {
      if (!canWrite()) return; COLS.forEach((c) => Object.values(data[c] || {}).forEach((rec) => { if (rec && rec.id) save(c, rec); })); toast("Imported " + n + " records");
    });
  };
  r.readAsText(file);
}

/* ---------- Events ---------- */
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]");
  if (!el || el.tagName === "INPUT" && el.type !== "checkbox") return;
  const fn = ACT[el.dataset.act]; if (!fn) return;
  if (el.tagName === "A" && el.getAttribute("href") && el.dataset.act !== "open-customer") return;
  e.preventDefault();
  fn(Object.assign({}, el.dataset), el);
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && $("#layer").innerHTML) closeSheet();
  if ((e.key === "Enter" || e.key === " ") && e.target.matches('[role="button"][data-act]')) { e.preventDefault(); e.target.click(); }
});
document.addEventListener("input", (e) => {
  const t = e.target;
  if (t.dataset.input === "q") { UI.q = t.value; render(); return; }
  if (t.dataset.input === "emonth") { UI.filter.emonth = t.value; render(); return; }
  const form = t.closest("#sheet-form");
  if (form) {
    if (t.classList.contains("it-name")) { const s = all("services").find((x) => x.name === t.value); if (s) { const row = t.closest(".item-row"); if (!num($(".it-price", row).value)) $(".it-price", row).value = s.price || ""; if (!num($(".it-qty", row).value)) $(".it-qty", row).value = 1; } }
    if (t.id === "f-msg") { const a = $("#sms-link"); const ph = a && a.getAttribute("href").split("?")[0]; if (a) a.setAttribute("href", ph + "?&body=" + encodeURIComponent(t.value)); }
    if (t.id === "f-customerId" && $("#items", form)) { /* nothing to sync yet */ }
    updateTotals(form);
  }
});
document.addEventListener("change", (e) => {
  if (e.target.id === "import-file" && e.target.files[0]) { importData(e.target.files[0]); e.target.value = ""; }
  if (e.target.dataset.input === "emonth") { UI.filter.emonth = e.target.value; render(); }
});
document.addEventListener("submit", (e) => {
  e.preventDefault();
  const form = e.target;
  if (form.id === "settings-form") { const d = formData(form); if (save("settings", Object.assign({}, S.settings.main || {}, d, { id: "main", taxRate: num(d.taxRate), terms: num(d.terms) || 7 }))) toast("Settings saved"); return; }
  if (form.id === "sheet-form" && sheetSubmit) {
    const after = sheetAfter; sheetAfter = null;
    const err = sheetSubmit(formData(form), form);
    if (typeof err === "string") { toast(err); sheetAfter = after; return; }
    if (after && !$("#layer").innerHTML) after();
    else if (after) sheetAfter = after;
  }
});

/* ---------- Boot ---------- */
async function boot() {
  const hash = (location.hash || "").slice(1);
  if (VIEWS[hash] && hash !== "customer") UI.view = hash;
  const inViewer = !!(window.claude && typeof window.claude.use === "function");
  loadInto(lsGet(inViewer ? CACHE_KEY : LOCAL_KEY));
  mode = inViewer ? "connecting" : "local";
  render();
  if (!inViewer) return;
  const d = await window.claude.use("db").catch(() => null);
  if (!d) { mode = "local"; COLS.forEach((c) => (S[c] = {})); loadInto(lsGet(LOCAL_KEY)); render(); return; }
  db = d; mode = "cloud";
  const seen = {};
  COLS.forEach((col) => {
    db.collection(col).onSnapshot((snap) => {
      const next = {}; snap.docs.forEach((doc) => { const v = doc.data(); if (v) next[doc.id] = Object.assign({}, v, { id: doc.id }); });
      S[col] = next; seen[col] = true; persist(); scheduleRender();
    }, (err) => { if (err && err.code === "revoked") { writeOk = false; toast("Your access to this CRM changed."); } });
  });
  render();
}
boot();
})();
</script>
